[tox]
skipsdist = True
envlist =
    style
    lint
    types
    cleanup
    spell
    unit
    # Not run by default
    # translations
    # integration-windows
    # integration-macos
    # ft
    # oft
    # clean
    # bench

[testenv]
setenv =
    SKIP_SENTRY = 1

#
# All env will use the same envdir as requirements are quite heavy to install.
# This is also preferable to ease dependency upgrades tracking.
#
[base]
deps =
    -r tools/deps/requirements-pip.txt
    -r tools/deps/requirements-tests.txt
passenv =
    DISPLAY
    FREEZE_ONLY
    GITHUB_HEAD_REF
    HOME
    JENKINS_URL
    NXDRIVE_TEST_NUXEO_URL
    NXDRIVE_TEST_PASSWORD
    NXDRIVE_TEST_USERNAME
    ALFRESCO_URL
    ALFRESCO_USER
    ALFRESCO_PASSWORD
    REPORT_PATH
    SECOND_PARTITION
    SENTRY_DSN
    SKIP_SENTRY
    USERNAME
    WS_DIR
    SYSTEM_VERSION_COMPAT
commands =
    # Keep dependencies up-to-date
    pip-sync tools/deps/requirements-pip.txt tools/deps/requirements-tests.txt

[testenv:bench]
description = Unit benchmarks
envdir = {toxworkdir}/base
deps =
    {[base]deps}
    -r tools/deps/requirements-bench.txt
commands =
    python -m pytest -c tests/benchmarks/empty.ini \
        --benchmark-group-by=param \
        --benchmark-sort=stddev \
        --benchmark-columns=min,max,mean,stddev \
        tests/benchmarks

[testenv:clean]
description = Clean-up tests data
envdir = {toxworkdir}/base
passenv = {[base]passenv}
deps = {[base]deps}
commands =
    {[base]commands}
    python tests/cleanup.py

[testenv:cleanup]
description = Dead code check
envdir = {toxworkdir}/base
deps = {[base]deps}
commands =
    {[base]commands}
    python -m vulture nxdrive tools/skiplist.py

[testenv:ft]
description = Functional tests
envdir = {toxworkdir}/base
passenv = {[base]passenv}
deps = {[base]deps}
commands =
    {[base]commands}
    python -m pytest {posargs} tests/common/functional tests/nuxeo/functional --dist=loadscope

[testenv:integration-windows]
description = Integration tests
envdir = {toxworkdir}/base
passenv = {[base]passenv}
deps = {[base]deps}
commands =
    {[base]commands}
    python -m pytest -n0 -v --tb=short --timeout=120 {posargs} tests/common/integration tests/nuxeo/integration --ignore=tests/common/integration/macos --ignore=tests/nuxeo/integration/macos

[testenv:integration-macos]
description = Integration tests
envdir = {toxworkdir}/base
passenv = {[base]passenv}
deps = {[base]deps}
commands =
    {[base]commands}
    python -m pytest -n0 {posargs} tests/common/integration/macos tests/nuxeo/integration/macos

[testenv:lint]
description = Code quality check
envdir = {toxworkdir}/base
deps = {[base]deps}
commands =
    {[base]commands}
    python -m flake8 nxdrive
    python -m flake8 tests
    python -m flake8 tools

[testenv:oft]
description = (old) Functional tests
envdir = {toxworkdir}/base
passenv = {[base]passenv}
deps = {[base]deps}
commands =
    {[base]commands}
    python -m pytest {posargs} tests/old_functional

[testenv:spell]
description = Grammar check
envdir = {toxworkdir}/base
allowlist_externals = sh
deps = {[base]deps}
commands =
    {[base]commands}
    sh ./tools/check-spell.sh

[testenv:style]
description = Code style check
envdir = {toxworkdir}/base
deps = {[base]deps}
commands =
    {[base]commands}
    python -m black --check --diff nxdrive
    python -m black --check --diff tests
    python -m black --check --diff tools

[testenv:translations]
description = Translation files check
commands = python tools/check_translations.py nxdrive/drive/data/i18n

[testenv:types]
description = Type annotations check
envdir = {toxworkdir}/base
deps = {[base]deps}
commands =
    {[base]commands}
    python -m mypy --platform win32 nxdrive

[testenv:unit]
description = Unit tests
envdir = {toxworkdir}/base
passenv = {[base]passenv}
deps = {[base]deps}
commands =
    {[base]commands}
    python -m pytest {posargs} tests/common/unit tests/nuxeo/unit --ignore=tests/old_tests

[testenv:alfresco-unit]
description = Alfresco unit tests (no server required)
envdir = {toxworkdir}/base
passenv = {[base]passenv}
deps = {[base]deps}
commands =
    {[base]commands}
    python -m pytest {posargs} tests/alfresco/unit

[testenv:alfresco-ft]
description = Alfresco functional tests (requires ALFRESCO_URL / _USER / _PASSWORD)
envdir = {toxworkdir}/base
passenv = {[base]passenv}
deps = {[base]deps}
commands =
    {[base]commands}
    python -m pytest {posargs} tests/alfresco/functional --dist=loadscope

[testenv:alfresco-integration-macos]
description = Alfresco macOS integration tests
envdir = {toxworkdir}/base
passenv = {[base]passenv}
deps = {[base]deps}
commands =
    {[base]commands}
    python -m pytest -n0 {posargs} tests/alfresco/integration/macos

[testenv:alfresco-integration-windows]
description = Alfresco Windows integration tests
envdir = {toxworkdir}/base
passenv = {[base]passenv}
deps = {[base]deps}
commands =
    {[base]commands}
    python -m pytest -n0 -v --tb=short --timeout=120 {posargs} tests/alfresco/integration --ignore=tests/alfresco/integration/macos

[testenv:alfresco-clean]
description = Clean-up Alfresco test data on the remote server
envdir = {toxworkdir}/base
passenv = {[base]passenv}
deps = {[base]deps}
commands =
    {[base]commands}
    python -m tests.alfresco.cleanup
