# Generate a new release (alpha or beta)
name: Release Alfresco Drive
permissions:
  contents: write
  pull-requests: read

on:
  workflow_dispatch:
    inputs:
      # Note: `releaseType` will be set to an empty string when automatically run without human action (via the cronjob).
      #       In that case, it means we want to generate an alpha.
      releaseType:
        description: 'Set to "release" for a beta release.'
        required: false
        default: "alpha"
      signExe:
        description: 'Set to "true" to generate sign .exe on Windows.'
        required: false
        default: "false"
      dockerNamespace:
        description: "The namespace (personal account name or organization name) in LOWERCASE, from where the docker image will be pulled."
        required: true

env:
  GITHUB_USERNAME: "nuxeodrive"
  GITHUB_EMAILID: "drive@hyland.com"

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, 'macos-15-intel']

    steps:
      - name: Inputs Received
        run: |
          echo "releaseType=${{ github.event.inputs.releaseType }}" >> $GITHUB_OUTPUT
          echo "signExe=${{ github.event.inputs.signExe }}" >> $GITHUB_OUTPUT
          echo "dockerNamespace=${{ github.event.inputs.dockerNamespace }}" >> $GITHUB_OUTPUT
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch }}

      #
      # Global
      #

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIV_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOST_DEPLOY }}

      - name: Setup git
        if: github.event.inputs.releaseType == 'alpha' || github.event.inputs.releaseType == ''
        run: |
          git config user.email ${{ env.GITHUB_EMAILID }}
          git config user.name ${{ env.GITHUB_USERNAME }}

      #
      # GNU/Linux
      #

      - name: "[GNU/Linux] Install AppImage checkers"
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt install --yes appstream desktop-file-utils

      - name: "[GNU/Linux] Login to the docker registry"
        if: matrix.os == 'ubuntu-latest'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GIT_DOCKER_REGISTRY_TOKEN }}

      - name: "[GNU/Linux] Set appropriate volume folders"
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir build dist venv
          chmod 777 build dist venv

      - name: "[GNU/Linux] Generate the .AppImage"
        if: matrix.os == 'ubuntu-latest'
        env:
          REGISTRY: "ghcr.io"
          REPOSITORY: "alfresco-drive-build"
        run: docker run -v "$(pwd)":/opt/sources "${REGISTRY}/${{ github.event.inputs.dockerNamespace }}/${REPOSITORY}:py-3.13.1" # XXX_PYTHON

      # - name: "[GNU/Linux] Ensure the AppImage is correct"
      #   if: matrix.os == 'ubuntu-latest'
      #   run: bash tools/linux/deploy_ci_agent.sh --check

      - name: "[GNU/Linux] Sign the .AppImage"
        if: matrix.os == 'ubuntu-latest'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: bash tools/linux/deploy_ci_agent.sh --sign

      - name: "[GNU/Linux] Verify the .AppImage signature"
        if: matrix.os == 'ubuntu-latest'
        env:
          GPG_KEY_FPR: ${{ secrets.GPG_KEY_FPR }}
        run: bash tools/linux/deploy_ci_agent.sh --verify-sign

      #
      # Windows
      #
      - name: "[Windows] Unlock PowerShell"
        if: matrix.os == 'windows-latest'
        run: powershell Set-ExecutionPolicy -ExecutionPolicy Unrestricted -Scope LocalMachine

      - name: "[Windows] Setup the environment"
        if: matrix.os == 'windows-latest'
        run: powershell ".\\tools\\windows\\deploy_ci_agent.ps1" -install_release

      - name: Setup Certificate
        if: matrix.os == 'windows-latest'
        run: |
           echo "${{ secrets.SM_CLIENT_CERT_FILE_B64 }}" | base64 --decode > /d/Certificate_pkcs12.p12
        shell: bash

      - name: Set variables
        if: matrix.os == 'windows-latest'
        id: variables
        run: |
          dir
          echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          echo "KEYPAIR_NAME=gt-standard-keypair"  >> $GITHUB_OUTPUT
          echo "CERTIFICATE_NAME=gt-certificate"  >> $GITHUB_OUTPUT
          echo "SM_HOST=${{ secrets.SM_HOST }}" >> "$GITHUB_ENV"
          echo "SM_API_KEY=${{ secrets.SM_API_KEY }}" >> "$GITHUB_ENV"
          echo "SM_CLIENT_CERT_FILE=D:\\Certificate_pkcs12.p12" >> "$GITHUB_ENV"
          echo "SM_CLIENT_CERT_PASSWORD=${{ secrets.SM_CLIENT_CERT_PASSWORD }}" >> "$GITHUB_ENV"
          echo "SM_KEYPAIR_ALIAS=${{ secrets.SM_KEYPAIR_ALIAS }}" >> "$GITHUB_ENV"
          echo "SM_CODE_SIGNING_CERT_SHA1_HASH=${{ secrets.SM_CODE_SIGNING_CERT_SHA1_HASH }}" >> "$GITHUB_ENV"
          echo "C:\Program Files (x86)\Windows Kits\10\App Certification Kit" >> $GITHUB_PATH
          echo "C:\Program Files (x86)\Microsoft SDKs\Windows\v10.0A\bin\NETFX 4.8 Tools" >> $GITHUB_PATH
          echo "C:\Program Files\DigiCert\DigiCert Keylocker Tools" >> $GITHUB_PATH
        shell: bash

      - name: Setup Keylocker KSP on windows
        if: matrix.os == 'windows-latest'
        run: |
          curl -X GET  https://one.digicert.com/signingmanager/api-ui/v1/releases/Keylockertools-windows-x64.msi/download -H "x-api-key:%SM_API_KEY%" -o Keylockertools-windows-x64.msi
          msiexec /i Keylockertools-windows-x64.msi /quiet /qn
          smksp_registrar.exe list
          smctl.exe keypair ls
          C:\Windows\System32\certutil.exe -csp "DigiCert Signing Manager KSP" -key -user
        shell: cmd

      - name: Certificates Sync
        if: matrix.os == 'windows-latest'
        run: |
           smctl windows certsync --keypair-alias=${{ secrets.SM_KEYPAIR_ALIAS }}
        shell: cmd

      - name: Health status
        if: matrix.os == 'windows-latest'
        run: |
           smctl healthcheck
        shell: cmd

      - name: "[Windows] Generate the .exe and validate against 2023"
        timeout-minutes: 15
        if: matrix.os == 'windows-latest'
        env:
          SIGN_EXE: ${{ github.event.inputs.signExe }}
          KEYCHAIN_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
          SIGNING_ID: "Alfresco"
          SIGNING_ID_NEW: "Hyland Software, Inc."
        run: powershell ".\\tools\\windows\\deploy_ci_agent.ps1" -check_upgrade_alfresco

      - name: "[Windows] Generate the .exe and validate against 2025"
        timeout-minutes: 15
        if: matrix.os == 'windows-latest'
        env:
          SIGN_EXE: ${{ github.event.inputs.signExe }}
          KEYCHAIN_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
          SIGNING_ID: "Alfresco"
          SIGNING_ID_NEW: "Hyland Software, Inc."
        run: powershell ".\\tools\\windows\\deploy_ci_agent.ps1" -build_alfresco_installer_and_sign

      #
      # macOS
      #

      - name: "[macOS] Setup certificates"
        # Using nuxeo drive certificate for macOS notarization, as Alfresco Drive is not notarized yet.
        if: matrix.os == 'macos-15-intel'
        run: |
          wget https://www.apple.com/appleca/AppleIncRootCertificate.cer
          echo "${{ secrets.HYLAND_DEVELOPER_ID_APPLICATION_CERT }}" | base64 --decode > developerID_application.p12
          echo "${{ secrets.HYLAND_DEVELOPER_ID_APPLICATION_PKEY }}" | base64 --decode > drive.priv

      # TODO: remove once macOS signing is confirmed working.
      - name: "[macOS] Debug — verify decoded certificate"
        if: matrix.os == 'macos-15-intel'
        env:
          CERT_B64: ${{ secrets.HYLAND_DEVELOPER_ID_APPLICATION_CERT }}
          PKEY_B64: ${{ secrets.HYLAND_DEVELOPER_ID_APPLICATION_PKEY }}
          P12_PWD:  ${{ secrets.HYLAND_DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
        run: |
          echo "CERT base64 length : $(printf '%s' "$CERT_B64" | wc -c | tr -d ' ')"
          echo "PKEY base64 length : $(printf '%s' "$PKEY_B64" | wc -c | tr -d ' ')"
          echo "P12  password length: $(printf '%s' "$P12_PWD"  | wc -c | tr -d ' ')"
          echo "developerID_application.p12 size : $(wc -c < developerID_application.p12 | tr -d ' ') bytes"
          echo "developerID_application.p12 sha256: $(shasum -a 256 developerID_application.p12 | awk '{print $1}')"
          echo "drive.priv size : $(wc -c < drive.priv | tr -d ' ') bytes"
          echo "drive.priv sha256: $(shasum -a 256 drive.priv | awk '{print $1}')"
          file developerID_application.p12 drive.priv
          echo "--- openssl integrity check (should print 'MAC verified OK') ---"
          openssl pkcs12 -info -in developerID_application.p12 -nokeys -legacy \
            -passin "pass:$P12_PWD" -noout && echo ">>> p12 decrypts OK" \
            || echo ">>> p12 decrypt FAILED with this password"

      - name: "[macOS] Setup the environment"
        if: matrix.os == 'macos-15-intel'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.3"
          SYSTEM_VERSION_COMPAT: 0
        run: bash tools/osx/deploy_ci_agent.sh --install-release

      - name: "[macOS] Generate the .dmg and validate against 2023"
        if: matrix.os == 'macos-15-intel'
        timeout-minutes: 25
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.3"
          KEYCHAIN_PATH: "~/Library/Keychains/drive.keychain-db"
          KEYCHAIN_PASSWORD: ${{ secrets.HYLAND_DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
          NOTARIZATION_USERNAME: ${{ vars.HYLAND_APPLE_ID_NOTARISATION }}
          NOTARIZATION_PASSWORD: ${{ secrets.HYLAND_APPLE_ID_PASS_NOTARISATION }}
          NOTARIZATION_TEAMID: ${{ vars.HYLAND_TEAM_ID }}
          SIGNING_ID: "Hyland Software, Inc."
          SIGNING_ID_NEW: "Hyland Software, Inc."
          SYSTEM_VERSION_COMPAT: 0
        run: bash tools/osx/deploy_ci_agent.sh --check-upgrade-alfresco

      - name: "[macOS] Generate the .dmg and validate against 2025"
        if: matrix.os == 'macos-15-intel'
        timeout-minutes: 25
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.3"
          KEYCHAIN_PATH: "~/Library/Keychains/drive.keychain-db"
          KEYCHAIN_PASSWORD: ${{ secrets.HYLAND_DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
          NOTARIZATION_USERNAME: ${{ vars.HYLAND_APPLE_ID_NOTARISATION }}
          NOTARIZATION_PASSWORD: ${{ secrets.HYLAND_APPLE_ID_PASS_NOTARISATION }}
          NOTARIZATION_TEAMID: ${{ vars.HYLAND_TEAM_ID }}
          SIGNING_ID: "Hyland Software, Inc."
          SIGNING_ID_NEW: "Hyland Software, Inc."
          SYSTEM_VERSION_COMPAT: 0
        run: bash tools/osx/deploy_ci_agent.sh --check-upgrade-alfresco

      - name: "Upload artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: package-distributions-${{ matrix.os }}
          path: |
            ./dist/*.exe
            ./dist/*.dmg
            ./dist/*.AppImage
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    environment: development
    env:
      S3_BUCKET: test-hyland-software-channel-dist
    needs: [release]
    permissions:
      id-token: write   # required for requesting the OIDC token
      contents: read
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13 # XXX_PYTHON

      - name: Install python dependencies
        run: python -m pip install pyyaml

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: package-distributions*
          path: dist/
          merge-multiple: true

      - name: Install curl
        run: sudo apt-get update && sudo apt-get install -y curl

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: arn:aws:iam::372466110691:role/AlfrescoCI/nuxeo-drive-software-channel-upload
          aws-region: us-east-1

      - name: Fetch versions.yml
        run: |
          bucket="$S3_BUCKET"
          key="alfresco/drive-updates/versions.yml"
          aws_err_file="$(mktemp)"

          if aws s3api get-object --bucket "$bucket" --key "$key" versions.yml 2>"$aws_err_file"; then
            echo ">>> versions.yml found in S3 and downloaded"
          else
            aws_error="$(cat "$aws_err_file")"

            if echo "$aws_error" | grep -Eq 'NoSuchKey|404|Not Found'; then
              echo ">>> versions.yml not found in S3, creating an empty one"
              : > versions.yml
              aws s3 cp versions.yml "s3://$bucket/$key"
            elif echo "$aws_error" | grep -q 'AccessDenied'; then
              echo ">>> Access denied while reading s3://$bucket/$key"
              echo "$aws_error"
              rm -f "$aws_err_file"
              exit 1
            else
              echo ">>> Unexpected AWS error while reading s3://$bucket/$key"
              echo "$aws_error"
              rm -f "$aws_err_file"
              exit 1
            fi
          fi

          rm -f "$aws_err_file"

      - name: Upload artifacts to software channel
        run: |
          release=${{ github.event.inputs.releaseType }}
          if [ "$release" = "alpha" ]; then
            aws s3 cp dist/ "s3://$S3_BUCKET/alfresco/drive-updates/alpha/" --recursive
          elif [ "$release" = "release" ]; then
            aws s3 cp dist/ "s3://$S3_BUCKET/alfresco/drive-updates/beta/" --recursive
          fi

      - name: Update versions.yml
        run: |
          export SERVER="alfresco"
          drive_version="$(grep __alfresco_version__ nxdrive/__init__.py | cut -d'"' -f2)"
          python tools/versions.py --add "$drive_version" --type "${{ github.event.inputs.releaseType }}" || exit 1
          python tools/versions.py --merge || exit 1
          aws s3 cp versions.yml "s3://$S3_BUCKET/alfresco/drive-updates/" --cache-control "no-cache, max-age=0, must-revalidate"
          python tools/versions.py --delete "$drive_version" || exit 1
          rm versions.yml
