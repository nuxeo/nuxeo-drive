on:
  pull_request:
    branches: master
    paths:
      - '.github/workflows'
      - 'nxdrive/*'
      - 'tools/*'
  schedule:
    - cron: '0 0 * * *'

jobs:
  analyze-github-actions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Scan GitHub actions
        uses: github/codeql-action/init@v4
        with:
          languages: actions
          build-mode: none
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
  analyze-python:
    runs-on: macos-15-intel
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Scan Python Code
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
  analyze-swift:
    runs-on: macos-15-intel
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Scan Swift Code
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: autobuild
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
  analyze-csharp:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Scan C# Code
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: autobuild
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
  analyze-cpp:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Scan C/C++ Code
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: none
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
  analyze-js:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Scan JavaScript/TypeScript Code
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
