name: Alfresco integration tests
permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    paths:
      - ".github/workflows/integration_tests_alfresco.yml"
      - "nxdrive/alfresco/**/*.py"
      - "nxdrive/drive/**/*.py"
      - "tests/alfresco/integration/**/*.py"
      - "tools/deps/*.txt"
  push:
    branches: [master]
    paths:
      - "nxdrive/alfresco/**/*.py"
      - "tests/alfresco/integration/**/*.py"

env:
  ALFRESCO_URL: ${{ secrets.ALFRESCO_TEST_URL }}
  ALFRESCO_USER: ${{ secrets.ALFRESCO_TEST_USERNAME }}
  ALFRESCO_PASSWORD: ${{ secrets.ALFRESCO_TEST_PASSWORD }}

jobs:
  alfresco-integration-tests-windows:
    timeout-minutes: 30
    runs-on: windows-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.1" # XXX_PYTHON
      - uses: actions/cache@v5
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('tools/deps/requirements.txt', 'tools/deps/requirements-tests.txt', 'tools/deps/requirements-dev.txt', 'tools/deps/requirements-tox.txt') }}
          restore-keys: ${{ runner.os }}-pip-${{ hashFiles('tools/deps/requirements.txt', 'tools/deps/requirements-tests.txt', 'tools/deps/requirements-dev.txt', 'tools/deps/requirements-tox.txt') }}
      - name: Freeze the application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-ExecutionPolicy -ExecutionPolicy Unrestricted -Scope LocalMachine
          & .\tools\windows\deploy_ci_agent.ps1 -install_release
          & .\tools\windows\deploy_ci_agent.ps1 -build
      - name: Install tox
        run: python -m pip install -r tools/deps/requirements-tox.txt
      - name: Alfresco integration tests
        run: tox -e alfresco-integration-windows
      - name: Upload coverage to Codecov
        if: ${{ success() || failure() }}
        uses: codecov/codecov-action@v6
        with:
          token: ${{secrets.CODECOV_TOKEN}}
          files: ./coverage.xml
          flags: alfresco-integration
          env_vars: OS,PYTHON

  alfresco-integration-tests-macos:
    timeout-minutes: 30
    runs-on: "macos-15-intel"
    strategy:
      fail-fast: false
    env:
      SYSTEM_VERSION_COMPAT: 0
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.1" # XXX_PYTHON
      - uses: actions/cache@v5
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('tools/deps/requirements.txt', 'tools/deps/requirements-tests.txt', 'tools/deps/requirements-dev.txt', 'tools/deps/requirements-tox.txt') }}
          restore-keys: ${{ runner.os }}-pip-${{ hashFiles('tools/deps/requirements.txt', 'tools/deps/requirements-tests.txt', 'tools/deps/requirements-dev.txt', 'tools/deps/requirements-tox.txt') }}
      - name: Install tox
        run: python -m pip install -r tools/deps/requirements-tox.txt
      - name: Alfresco integration tests
        run: tox -e alfresco-integration-macos
      - name: Upload coverage to Codecov
        if: ${{ success() || failure() }}
        uses: codecov/codecov-action@v6
        with:
          token: ${{secrets.CODECOV_TOKEN}}
          files: ./coverage.xml
          flags: alfresco-integration
          env_vars: OS,PYTHON
